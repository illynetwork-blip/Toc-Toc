<style>
  :root{color-scheme:dark}

  .lk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 12px;box-sizing:border-box}
  .lk-card{width:100%;max-width:340px;text-align:center}
  .lk-logo{width:96px;height:96px;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}

  .lk-name span{color:#C8633A}
  .lk-by{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8FA89A;margin:8px 0 6px}

  form{display:flex;flex-direction:column;gap:10px}
  input[type=password]{font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;border:1.5px solid #4a5f76;background:#18222f;color:#F7F3EC;text-align:center;letter-spacing:.2em;outline:none}
  input[type=password]:focus{border-color:#C8633A}
  button{font:600 16px/1 inherit;font-family:inherit;padding:14px;border:0;border-radius:12px;background:#C8633A;color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#E9D8C4;margin-top:2px}
  .lk-err{min-height:1.3em;font-size:14px;color:#F2A27E}
  .lk-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:#aab6c2;max-width:360px}
  .lk-foot p{margin:4px 0}
  .lk-rights{font-size:10.5px;opacity:.75}
  .lk-lang{font:12px/1 system-ui,sans-serif;background:none;border:1px solid #4a5f76;color:#E9D8C4;border-radius:999px;padding:6px 12px;cursor:pointer;margin:6px 0}
  .lk-lang b{color:#C8633A}
  .shake{animation:sh .4s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
